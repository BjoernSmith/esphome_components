# HeatMesh fix v0.1.1 - KC868-A16, one local BTHome v2 zone.
# Bench-test this version before allowing it to control the heating system.
# Location: <repo>/components/FloorheatCtrl_A16/a16_v01_singlezone.yaml

substitutions:
  sensor_01_friendly_name: "Badeværelse"
  sensor_01_mac_address: "A4:C1:38:14:28:EA"
  zone_id: test_living_room

esphome:
  name: floorheatctrl-v01
  friendly_name: FloorHeat_v01_SingleZone
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Number restore publishes a value, but does not execute set_action.
          auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
          if (zone != nullptr) {
            zone->set_target_temperature(id(zone_setpoint).state);
          } else {
            ESP_LOGE("heatmesh_test", "Zone lookup failed after setup");
          }

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 115200
  logs:
    # PI and output decisions. Keep at DEBUG while tuning.
    heatmesh.zone: DEBUG


api:
  # Local control must not reboot because HA is disconnected.
  reboot_timeout: 0s
  encryption:
    key: !secret floorheatctrl_v01__encryption_key
ota:
  - platform: esphome
    # Optional: password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

esp32_ble_tracker:
  # The original scan timing is retained to isolate the software fixes.
  scan_parameters:
    interval: 320ms
    window: 300ms

# External component: heatmesh (GitHub version)
external_components:
  - source: github://BjoernSmith/esphome_components@main
    components: [heatmesh]
    refresh: 0s

i2c:
  - scl:
      number: 5
      ignore_strapping_warning: true
    sda: 4

pcf8574:
  - id: outputs_1_8
    address: 0x24
    pcf8575: false

switch:
  - platform: gpio
    id: test_valve_y01
    name: "Test Valve (Y01)"
    # HeatMesh owns this output. Avoid a second controller via the HA switch UI.
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: outputs_1_8
      number: 0
      inverted: true
      mode: OUTPUT

sensor:
  - platform: bthome_mithermometer
    mac_address: ${sensor_01_mac_address}
    # Only when encryption is enabled on the sensor, and supported by your
    # installed ESPHome version: bindkey: !secret sensor_01_bindkey
    temperature:
      name: "${sensor_01_friendly_name} Temp"
      id: test_zone_temp
      # No heartbeat, timeout-generated values or repeated template values here:
      # the component's freshness timeout follows real sensor publications.
    humidity:
      name: "${sensor_01_friendly_name} Humidity"
      id: test_zone_humidity
    battery_level:
      name: "${sensor_01_friendly_name} Battery"
      id: test_zone_battery

  - platform: template
    name: "Test Zone Current Temp"
    unit_of_measurement: "\u00b0C"
    accuracy_decimals: 2
    lambda: |-
      auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
      return zone ? zone->get_current_temperature() : NAN;
    update_interval: 10s

  - platform: template
    name: "Test Zone Setpoint"
    unit_of_measurement: "\u00b0C"
    accuracy_decimals: 1
    lambda: |-
      auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
      return zone ? zone->get_target_temperature() : NAN;
    update_interval: 10s

  - platform: template
    name: "Test Zone Heat Demand"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: |-
      auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
      return zone ? zone->get_heat_demand_percent() : NAN;
    update_interval: 10s

  - platform: template
    name: "Test Zone Sensor Age"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    lambda: |-
      auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
      if (zone == nullptr || zone->get_sensor_age_ms() == UINT32_MAX) return NAN;
      return zone->get_sensor_age_ms() / 1000.0f;
    update_interval: 10s

  - platform: template
    name: "Test Zone Valve Switches"
    accuracy_decimals: 0
    lambda: |-
      auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
      return zone ? static_cast<float>(zone->get_valve_switch_count()) : NAN;
    update_interval: 60s

heatmesh:
  id: heatmesh_controller
  zones:
    - zone_id: ${zone_id}
      # Bench-test values, not yet validated on the real floor.
      # kp: percentage points / K; ki: percentage points / (K * second), so Ti = kp / ki = 20 min.
      temperature_sensor: test_zone_temp
      valve: test_valve_y01
      target_temperature: 21.0
      sensor_timeout: 15min
      kp: 1.2
      ki: 0.001
      period_ms: 30000
      pwm_period_min: 15
      min_on_time: 5min

binary_sensor:
  - platform: template
    name: "Test Zone Sensor Valid"
    lambda: |-
      auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
      return zone ? zone->get_sensor_valid() : false;

  - platform: template
    name: "Test Zone Valve State"
    # Electrical ON/OFF command, not actual mechanical valve position.
    lambda: |-
      auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
      return zone ? zone->get_valve_state() : false;

number:
  - platform: template
    id: zone_setpoint
    name: "Test Zone Setpoint"
    unit_of_measurement: "\u00b0C"
    min_value: 5.0
    max_value: 30.0
    step: 0.5
    initial_value: 21.0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          auto *zone = id(heatmesh_controller).get_zone("${zone_id}");
          if (zone != nullptr) {
            zone->set_target_temperature(x);
          } else {
            ESP_LOGE("heatmesh_test", "Cannot set setpoint: zone not initialized");
          }
