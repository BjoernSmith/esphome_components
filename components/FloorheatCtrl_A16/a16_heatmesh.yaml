# HeatMesh v0.2.0 - KC868-A16, three local BTHome v2 zones on Y01-Y03.
# Bench-test new functionality before allowing it to control the heating system.
# Location: <repo>/components/FloorheatCtrl_A16/a16_heatmesh.yaml

substitutions:
  sensor_01_friendly_name: "Victor"
  sensor_01_mac_address: "A4:C1:38:1F:B3:28"
  sensor_02_friendly_name: "Nohr"
  sensor_02_mac_address: "A4:C1:38:06:B9:D8"
  sensor_03_friendly_name: "Bagstue"
  sensor_03_mac_address: "A4:C1:38:09:7B:7B"
  zone_id_1: victor_room
  zone_name_1: "Victor"
  zone_id_2: nohr_room
  zone_name_2: "Nohr"
  zone_id_3: bagstue_room
  zone_name_3: "Bagstue"

esphome:
  # Hostname, OTA target and Home Assistant device ID: keep unchanged.
  name: floorheatctrl-v01
  friendly_name: FloorHeat A16

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  # Per-tag levels may only be less verbose than the global level.
  # DEBUG shows PI calculations and output decisions (heatmesh.zone) while tuning.
  level: DEBUG
  baud_rate: 115200
  logs:
    bthome_mithermometer: INFO
    esp32_ble_tracker: INFO

api:
  # Local control must not reboot because HA is disconnected.
  reboot_timeout: 0s
  encryption:
    key: !secret floorheatctrl_v01__encryption_key
ota:
  - platform: esphome
    # Optional: password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

esp32_ble_tracker:
  # The original scan timing is retained to isolate the software fixes.
  scan_parameters:
    interval: 320ms
    window: 300ms

# Bluetooth proxy to Home Assistant
bluetooth_proxy:
  active: false

# External component: heatmesh (GitHub version)
external_components:
  - source: github://BjoernSmith/esphome_components@main
    components: [heatmesh]
    refresh: 0s

i2c:
  - scl:
      number: 5
      ignore_strapping_warning: true
    sda: 4

pcf8574:
  - id: outputs_1_8
    address: 0x24
    pcf8575: false

switch:
  - platform: gpio
    id: test_valve_y01
    name: "Test Valve (Y01)"
    # HeatMesh owns this output. Avoid a second controller via the HA switch UI.
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: outputs_1_8
      number: 0
      inverted: true
      mode: OUTPUT
  - platform: gpio
    id: test_valve_y02
    name: "Test Valve (Y02)"
    # HeatMesh owns this output. Avoid a second controller via the HA switch UI.
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: outputs_1_8
      number: 1
      inverted: true
      mode: OUTPUT
  - platform: gpio
    id: test_valve_y03
    name: "Test Valve (Y03)"
    # HeatMesh owns this output. Avoid a second controller via the HA switch UI.
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: outputs_1_8
      number: 2
      inverted: true
      mode: OUTPUT

sensor:
  - platform: bthome_mithermometer
    mac_address: ${sensor_01_mac_address}
    # Only when encryption is enabled on the sensor, and supported by your
    # installed ESPHome version: bindkey: !secret sensor_01_bindkey
    temperature:
      name: "${sensor_01_friendly_name} Temp"
      id: test_zone1_temp
      # No heartbeat, timeout-generated values or repeated template values here:
      # the component's freshness timeout follows real sensor publications.
    humidity:
      name: "${sensor_01_friendly_name} Humidity"
      id: test_zone1_humidity
    battery_level:
      name: "${sensor_01_friendly_name} Battery"
      id: test_zone1_battery

  - platform: bthome_mithermometer
    mac_address: ${sensor_02_mac_address}
    # Only when encryption is enabled on the sensor, and supported by your
    # installed ESPHome version: bindkey: !secret sensor_02_bindkey
    temperature:
      name: "${sensor_02_friendly_name} Temp"
      id: test_zone2_temp
      # No heartbeat, timeout-generated values or repeated template values here:
      # the component's freshness timeout follows real sensor publications.
    humidity:
      name: "${sensor_02_friendly_name} Humidity"
      id: test_zone2_humidity
    battery_level:
      name: "${sensor_02_friendly_name} Battery"
      id: test_zone2_battery
    
  - platform: bthome_mithermometer
    mac_address: ${sensor_03_mac_address}
    # Only when encryption is enabled on the sensor, and supported by your
    # installed ESPHome version: bindkey: !secret sensor_03_bindkey
    temperature:
      name: "${sensor_03_friendly_name} Temp"
      id: test_zone3_temp
      # No heartbeat, timeout-generated values or repeated template values here:
      # the component's freshness timeout follows real sensor publications.
    humidity:
      name: "${sensor_03_friendly_name} Humidity"
      id: test_zone3_humidity
    battery_level:
      name: "${sensor_03_friendly_name} Battery"
      id: test_zone3_battery


heatmesh:
  id: heatmesh_controller
  zones:
    - zone_id: ${zone_id_1}
      temperature_sensor: test_zone1_temp
      valve: test_valve_y01
      # Only used until the thermostat has stored a setpoint in flash.
      target_temperature: 20.0
      sensor_timeout: 15min
      # Bench-test values, not yet validated on the real floor.
      # kp: percentage points / K -> 1 K below setpoint = 100 % demand.
      # ki: percentage points / (K * second), so Ti = kp / ki = ~4 h.
      kp: 100
      ki: 0.007
      period_ms: 30000
      pwm_period_min: 180
      min_on_time: 30min
      min_off_time: 0s
      # Setpoint raised above room temperature (or OFF -> HEAT below setpoint):
      # output ON at once for up to this time, then PI takes over. Once ON it stays
      # ON for at least min_on_time, even if the setpoint is reached earlier.
      boost_time: 30min
      # Home Assistant entities. All are optional; regulation runs without them.
      climate:
        # Thermostat: current/target temperature, HEAT/OFF and heating/idle.
        # Mode and setpoint are restored after reboot.
        name: "${zone_name_1}"
      heat_demand:
        name: "${zone_name_1} Heat Demand"
      sensor_age:
        name: "${zone_name_1} Sensor Age"
      sensor_valid:
        name: "${zone_name_1} Sensor Valid"
      valve_state:
        # Electrical ON/OFF command, not actual mechanical valve position.
        name: "${zone_name_1} Valve State"
      valve_switch_count:
        name: "${zone_name_1} Valve Switches"
        
    - zone_id: ${zone_id_2}
      temperature_sensor: test_zone2_temp
      valve: test_valve_y02
      # Only used until the thermostat has stored a setpoint in flash.
      target_temperature: 20.0
      sensor_timeout: 15min
      # Bench-test values, not yet validated on the real floor.
      # kp: percentage points / K -> 1 K below setpoint = 100 % demand.
      # ki: percentage points / (K * second), so Ti = kp / ki = ~4 h.
      kp: 100
      ki: 0.007
      period_ms: 30000
      pwm_period_min: 180
      min_on_time: 30min
      min_off_time: 0s
      # Setpoint raised above room temperature (or OFF -> HEAT below setpoint):
      # output ON at once for up to this time, then PI takes over. Once ON it stays
      # ON for at least min_on_time, even if the setpoint is reached earlier.
      boost_time: 30min
      # Home Assistant entities. All are optional; regulation runs without them.
      climate:
        # Thermostat: current/target temperature, HEAT/OFF and heating/idle.
        # Mode and setpoint are restored after reboot.
        name: "${zone_name_2}"
      heat_demand:
        name: "${zone_name_2} Heat Demand"
      sensor_age:
        name: "${zone_name_2} Sensor Age"
      sensor_valid:
        name: "${zone_name_2} Sensor Valid"
      valve_state:
        # Electrical ON/OFF command, not actual mechanical valve position.
        name: "${zone_name_2} Valve State"
      valve_switch_count:
        name: "${zone_name_2} Valve Switches"
      
    - zone_id: ${zone_id_3}
      temperature_sensor: test_zone3_temp
      valve: test_valve_y03
      # Only used until the thermostat has stored a setpoint in flash.
      target_temperature: 20.0
      sensor_timeout: 15min
      # Bench-test values, not yet validated on the real floor.
      # kp: percentage points / K -> 1 K below setpoint = 100 % demand.
      # ki: percentage points / (K * second), so Ti = kp / ki = ~4 h.
      kp: 100
      ki: 0.007
      period_ms: 30000
      pwm_period_min: 180
      min_on_time: 30min
      min_off_time: 0s
      # Setpoint raised above room temperature (or OFF -> HEAT below setpoint):
      # output ON at once for up to this time, then PI takes over. Once ON it stays
      # ON for at least min_on_time, even if the setpoint is reached earlier.
      boost_time: 30min
      # Home Assistant entities. All are optional; regulation runs without them.
      climate:
        # Thermostat: current/target temperature, HEAT/OFF and heating/idle.
        # Mode and setpoint are restored after reboot.
        name: "${zone_name_3}"
      heat_demand:
        name: "${zone_name_3} Heat Demand"
      sensor_age:
        name: "${zone_name_3} Sensor Age"
      sensor_valid:
        name: "${zone_name_3} Sensor Valid"
      valve_state:
        # Electrical ON/OFF command, not actual mechanical valve position.
        name: "${zone_name_3} Valve State"
      valve_switch_count:
        name: "${zone_name_3} Valve Switches"
